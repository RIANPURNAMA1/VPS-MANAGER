[package]
name = "vps-manager"
version = "0.1.0"
description = "VPS Manager — aplikasi desktop untuk mengelola VPS Ubuntu lewat SSH/SFTP"
edition = "2021"
rust-version = "1.90"

[lib]
name = "vps_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ssh2 = "0.9"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# libssh2 backend WinCNG di Windows tidak mendukung kunci ed25519/OpenSSH,
# jadi di Windows kita memakai OpenSSL yang di-vendor (butuh Perl saat build).
[target.'cfg(windows)'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
